<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Clothify</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gradient-to-br from-purple-100 to-pink-100 text-gray-800">
  <main class="max-w-sm mx-auto mt-24 bg-white p-6 rounded shadow">
    <h2 class="text-xl font-bold text-center mb-4">📝 Create an Account</h2>
    <form>
      <input type="text" placeholder="Full Name" class="block w-full mb-4 p-2 border rounded">
      <input type="email" placeholder="Email" class="block w-full mb-4 p-2 border rounded">
      <input type="password" placeholder="Password" class="block w-full mb-4 p-2 border rounded">
      <input type="password" placeholder="Confirm Password" class="block w-full mb-4 p-2 border rounded">
      <button type="submit" class="w-full bg-pink-600 text-white px-4 py-2 rounded hover:bg-pink-700">Register</button>
    </form>
    <p class="text-center mt-4 text-sm text-gray-600">Already have an account? <a href="login.html" class="text-pink-600 hover:underline">Login</a></p>
  </main>
</body>
</html>
