<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop - Clothify</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(270deg, #fffde7, #e8f5e9, #fce4ec);
      background-size: 600% 600%;
      animation: gradientFlow 18s ease infinite;
    }
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .product-img {
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .product-img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body class="text-gray-900">
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto p-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">🛍️ CLOTHIFY SHOP</h1>
      <nav class="space-x-4">
        <a href="index.html" class="text-pink-600 hover:underline">Home</a>
        <a href="login.html" class="text-pink-600 hover:underline">Login</a>
        <a href="register.html" class="text-pink-600 hover:underline">Register</a>
      </nav>
    </div>
  </header>

  <img src="https://images.unsplash.com/photo-1521337581100-8ca9a73a5f79?auto=format&fit=crop&w=1600&q=80" alt="Shop Banner" class="w-full h-64 object-cover mb-8 shadow">

  <main class="max-w-7xl mx-auto py-8 px-4">
    <h2 class="text-3xl font-semibold text-center mb-8">Our Products</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <div class="bg-white p-4 rounded shadow hover:shadow-xl transition">
        <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" alt="White Shirt" class="mb-4 rounded product-img">
        <h3 class="font-semibold text-lg">Classic White Shirt</h3>
        <p class="text-pink-600 font-bold">$24.99</p>
      </div>
      <div class="bg-white p-4 rounded shadow hover:shadow-xl transition">
        <img src="https://images.unsplash.com/photo-1582738414690-d03f9307d60c?auto=format&fit=crop&w=600&q=80" alt="Casual Dress" class="mb-4 rounded product-img">
        <h3 class="font-semibold text-lg">Casual Dress</h3>
        <p class="text-pink-600 font-bold">$39.99</p>
      </div>
      <div class="bg-white p-4 rounded shadow hover:shadow-xl transition">
        <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=600&q=80" alt="Winter Coat" class="mb-4 rounded product-img">
        <h3 class="font-semibold text-lg">Winter Coat</h3>
        <p class="text-pink-600 font-bold">$89.99</p>
      </div>
    </div>
  </main>

  <footer class="bg-white text-center border-t py-6 mt-12">
    &copy; 2025 CLOTHIFY. All rights reserved.
  </footer>
</body>
</html>
