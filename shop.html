<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop - Clothify</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gradient-to-b from-white to-pink-50 text-gray-900">
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto p-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">🛍️ CLOTHIFY SHOP</h1>
      <nav class="space-x-4">
        <a href="index.html" class="text-pink-600 hover:underline">Home</a>
        <a href="login.html" class="text-pink-600 hover:underline">Login</a>
        <a href="register.html" class="text-pink-600 hover:underline">Register</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto py-12 px-4">
    <h2 class="text-3xl font-semibold text-center mb-8">Our Products</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <div class="bg-white p-4 rounded shadow hover:shadow-xl transition">
        <img src="https://images.unsplash.com/photo-1593032465171-bd441a7b4408?auto=format&fit=crop&w=600&q=80" alt="T-Shirt" class="mb-4 rounded">
        <h3 class="font-semibold text-lg">Basic T-Shirt</h3>
        <p class="text-pink-600 font-bold">$19.99</p>
      </div>
      <div class="bg-white p-4 rounded shadow hover:shadow-xl transition">
        <img src="https://images.unsplash.com/photo-1602810318493-6f72f4bfb0b0?auto=format&fit=crop&w=600&q=80" alt="Jacket" class="mb-4 rounded">
        <h3 class="font-semibold text-lg">Denim Jacket</h3>
        <p class="text-pink-600 font-bold">$49.99</p>
      </div>
      <div class="bg-white p-4 rounded shadow hover:shadow-xl transition">
        <img src="https://images.unsplash.com/photo-1618354691373-c7c37f7aa5d2?auto=format&fit=crop&w=600&q=80" alt="Joggers" class="mb-4 rounded">
        <h3 class="font-semibold text-lg">Jogger Pants</h3>
        <p class="text-pink-600 font-bold">$29.99</p>
      </div>
    </div>
  </main>

  <footer class="bg-white text-center border-t py-6 mt-12">
    &copy; 2025 CLOTHIFY. All rights reserved.
  </footer>
</body>
</html>
