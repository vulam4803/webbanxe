<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Clothify</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle, #f3e5f5, #e1bee7);
      animation: fadeIn 1.2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body class="text-gray-800">
  <main class="max-w-sm mx-auto mt-20 bg-white p-6 rounded shadow-lg">
    <img src="https://images.unsplash.com/photo-1587613865763-4db6c19d7200?auto=format&fit=crop&w=600&q=80" alt="Login" class="mb-6 rounded">
    <h2 class="text-xl font-bold text-center mb-4">🔐 Login to Clothify</h2>
    <form>
      <input type="email" placeholder="Email" class="block w-full mb-4 p-2 border rounded">
      <input type="password" placeholder="Password" class="block w-full mb-4 p-2 border rounded">
      <button type="submit" class="w-full bg-pink-600 text-white px-4 py-2 rounded hover:bg-pink-700">Login</button>
    </form>
    <div class="flex justify-between mt-6">
      <a href="register.html" class="text-sm text-pink-600 hover:underline">Register</a>
      <a href="index.html" class="text-sm text-pink-600 hover:underline">← Back to Home</a>
    </div>
  </main>
</body>
</html>
